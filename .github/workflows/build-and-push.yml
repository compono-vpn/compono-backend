name: Compono Backend CI/CD

# BDT-398: typecheck + lint + the existing unit tests are required gate jobs
# in this SAME workflow so a red gate blocks the image build (needs:).
# Minimal-footprint fork policy: only existing package.json scripts are used
# (no new test runner/deps added) — `test` runs each *.test.ts file directly
# via the invocation documented in that file's own header comment (node:test
# via ts-node, no jest/vitest install needed).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        default: 'latest'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: compono-vpn/compono-backend

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run migrate:generate
      - run: npx tsc --noEmit -p tsconfig.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run migrate:generate
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run migrate:generate
      - run: npx ts-node --transpile-only -P tsconfig.json src/modules/nodes/utils/reconcile-diff.test.ts
      - run: npx ts-node --transpile-only -P tsconfig.json src/common/utils/network/is-trusted-internal-source.test.ts
      - run: npx ts-node --transpile-only -P tsconfig.json src/modules/subscription-template/generators/xray.generator.service.test.ts
      - run: npx ts-node -r tsconfig-paths/register --transpile-only -P tsconfig.json src/common/helpers/xray-config/xray-config.validator.test.ts

  generate-tag:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Generate Tag
    needs: [typecheck, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.new_tag.outputs.new_tag }}
      sha_short: ${{ steps.get-short.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get short Git SHA
        id: get-short
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Auto-increment tag
        id: new_tag
        uses: mathieudutour/github-tag-action@v6.2
        if: github.event_name != 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch

  build:
    name: Build
    needs: [generate-tag, typecheck, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ci.Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_HASH=${{ needs.generate-tag.outputs.sha_short }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  dispatch-update:
    name: Dispatch Tag to ArgoCD
    needs: [generate-tag, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tag update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: bdtfs/argocd
          event-type: image-update
          client-payload: |
            {
              "tag": "${{ needs.generate-tag.outputs.tag }}",
              "path": "compono-backend"
            }
